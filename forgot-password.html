<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050608" />
  <title>Forgot password — Grok Trade</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="forgot-title">
      <a class="auth-brand" href="index.html" aria-label="Grok Trade home">
        <img src="assets/grok.jpg" alt="" class="auth-logo" />
        <span>Grok Trade</span>
      </a>
      <button class="auth-close" type="button" aria-label="Back to sign in" onclick="location.href='sign-in.html'">×</button>

      <div class="auth-heading">
        <h1 id="forgot-title">Reset password</h1>
        <p>Use your recovery code to set a new password.</p>
      </div>

      <div id="authMessage" class="auth-message" role="alert" hidden></div>

      <form id="forgotPasswordForm" class="auth-form" novalidate>
        <label class="auth-field">
          <span>Email</span>
          <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="Email" required />
        </label>

        <label class="auth-field">
          <span>Recovery code</span>
          <input id="recoveryCode" type="text" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" required />
        </label>

        <label class="auth-field auth-password">
          <span>New password</span>
          <input id="password" type="password" autocomplete="new-password" placeholder="New password" required />
          <button class="password-toggle" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false">◉</button>
        </label>

        <label class="auth-field">
          <span>Confirm new password</span>
          <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm new password" required />
        </label>

        <button class="auth-submit" type="submit" data-default-label="Reset password">Reset password</button>
      </form>

      <p class="auth-switch">Remembered your password? <a href="sign-in.html">Sign in</a></p>
      <p class="auth-footnote">Recovery is device-local. Your recovery code was created when you opened the account.</p>
    </section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
